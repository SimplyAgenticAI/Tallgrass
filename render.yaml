services:
  - type: web
    name: outlier
    runtime: python

    # Persistent disks require a paid instance type — they are not available
    # on the free plan. Without one the SQLite file lives on the deploy's
    # ephemeral filesystem and every push destroys all captured posts.
    plan: starter

    buildCommand: pip install -r requirements.txt

    # Single worker on purpose. SQLite tolerates concurrent readers but only
    # one writer, and several gunicorn processes writing the same file will
    # produce "database is locked" errors under capture load. Threads give
    # concurrency inside that one process. Do not raise --workers: a second
    # process is a second writer.
    #
    # This is the command the live service runs (one worker, four threads,
    # 120s timeout) on the starter instance with this 1 GB disk. Each request
    # opens its own SQLite connection, and that connection asks for a 16 MB
    # page cache, on an instance this app treats as 512 MB. Four threads is
    # the concurrency that is actually in production. More threads would not
    # add a writer process, but they would multiply that cache on a machine
    # that is already sharing the disk with the database and its backups.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120

    healthCheckPath: /api/ping

    disk:
      name: outlier-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # Points the database at the mounted disk. This is the setting that
      # makes captures survive a deploy; without it the app writes to ./data
      # and silently loses everything on restart.
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: "3.12.0"
