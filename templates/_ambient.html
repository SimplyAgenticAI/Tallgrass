{# The one ambient layer.
   A later holiday theme recolors it by setting --accent, --accent-glow and
   --ambient-particle on html[data-theme], and can restyle the motes and
   blades in here without touching a button, a card, or any copy. #}
<div class="ambient" data-ambient aria-hidden="true">
  <span class="ambient-glow"></span>
  <span class="ambient-motes">
    <span class="ambient-particle"></span>
    <span class="ambient-particle"></span>
    <span class="ambient-particle"></span>
    <span class="ambient-particle"></span>
    <span class="ambient-particle"></span>
    <span class="ambient-particle"></span>
  </span>
  <span class="ambient-grass">
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
    <span class="ambient-blade"></span>
  </span>
</div>
