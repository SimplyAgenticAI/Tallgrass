{# A small charm on the logo mark. Rendered only in its season, so a default
   day adds nothing to the mark. #}
{% if theme == 'halloween' %}
<g class="season-symbol season-pumpkin" fill="#f59e42">
  <rect class="stem" x="4.15" y="0.25" width="1.7" height="2.35" rx="0.5" fill="#b6cf62"/>
  <ellipse cx="3.05" cy="5.55" rx="2.05" ry="2.45"/>
  <ellipse cx="5.05" cy="5.25" rx="2.25" ry="2.9"/>
  <ellipse cx="7.05" cy="5.55" rx="2.05" ry="2.45"/>
  <path d="M5.05 2.7v5.1" fill="none" stroke="#c2410c" stroke-width=".4" opacity=".7"/>
</g>
{% elif theme == 'thanksgiving' %}
<g class="season-symbol season-leaf" fill="#e0a84f" transform="translate(0.35 0.15) scale(0.68)">
  <path d="M10 0.6C10.2 3.2 9.4 4.6 8.2 5.2 9.6 5.6 10.4 6.8 10.4 8.2 11.2 6.8 12.6 6 14.2 6.2 13.2 7.6 13.4 9 14.4 10.2 16.2 9.6 17.8 10.6 18.2 12.2 16.4 12.6 15.2 14 14.6 15.4 15.2 16.2 16 17.2 15.6 18.2 13.6 17.4 12.2 17 11.6 18.2L11.6 21.2 8.4 21.2 8.4 18.2C7.8 17 6.4 17.4 4.4 18.2 4 17.2 4.8 16.2 5.4 15.4 4.8 14 3.6 12.6 1.8 12.2 2.2 10.6 3.8 9.6 5.6 10.2 6.6 9 6.8 7.6 5.8 6.2 7.4 6 8.8 6.8 9.6 8.2 9.6 6.8 10.4 5.6 11.8 5.2 10.6 4.6 9.8 3.2 10 0.6Z"/>
</g>
{% elif theme == 'winter' %}
<g class="season-symbol season-flake" fill="none" stroke="#e0f2fe" stroke-width=".8" stroke-linecap="round">
  <path d="M5 .9v8.2M1.3 2.8l7.4 4.4M1.3 7.2l7.4-4.4"/>
  <path d="M5 2.2 3.9 3.1M5 2.2 6.1 3.1M5 7.8 3.9 6.9M5 7.8 6.1 6.9"/>
</g>
{% endif %}
