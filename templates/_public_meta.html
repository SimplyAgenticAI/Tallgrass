<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ public_origin }}{{ canonical_path }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ app_name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ public_origin }}{{ canonical_path }}">
<meta property="og:image" content="{{ public_origin }}{{ url_for('static', filename='og.png') }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ app_name }}: {{ app_tagline }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ public_origin }}{{ url_for('static', filename='og.png') }}">
<meta name="twitter:image:alt" content="{{ app_name }}: {{ app_tagline }}">
