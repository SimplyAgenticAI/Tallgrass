# The suite already existed and was already good. Nothing ran it, which meant
# a green run only ever proved that somebody remembered to type the command.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The extension tests and the syntax gate are both Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the suite
        # run.sh is the same entry point used locally, so CI cannot drift into
        # testing something different from what a developer runs.
        run: sh tests/run.sh

      - name: Check the version was bumped
        # APP_VERSION moves on every dashboard change. The extension manifest
        # moves only when extension/ does — bumping it on a dashboard-only PR
        # is what made the store listing and the repo disagree.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          base="origin/$GITHUB_BASE_REF"
          pyver() {
            python -c 'import re,sys; m=re.search(r"^APP_VERSION = .([0-9.]+).", sys.stdin.read(), re.M); print(m.group(1) if m else "")'
          }
          before=$(git show "$base:app.py" | pyver)
          after=$(pyver < app.py)
          echo "APP_VERSION: $before -> $after"
          if [ "$before" = "$after" ]; then
            echo "::error::APP_VERSION in app.py is unchanged ($after)"
            exit 1
          fi
          if git diff --name-only "$base" HEAD | grep -q '^extension/'; then
            before_m=$(git show "$base:extension/manifest.json" \
                       | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
            after_m=$(python -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
            echo "manifest version: $before_m -> $after_m"
            if [ "$before_m" = "$after_m" ]; then
              echo "::error::extension/ changed but manifest.json version is unchanged ($after_m)"
              exit 1
            fi
          fi
